services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-postgres"
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_mihomo
      POSTGRES_USER: platform_mihomo
      POSTGRES_PASSWORD_FILE: /run/secrets/platform_postgres_password
    secrets: [platform_postgres_password]
    volumes: [platform-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_mihomo -d platform_mihomo"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [platform-private]

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis"
    restart: unless-stopped
    command: ["redis-server", "/run/secrets/platform_redis_config", "--appendonly", "yes"]
    secrets: [platform_redis_config, platform_redis_password]
    volumes: [platform-redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/platform_redis_password) redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform-private]

  platform-mihomo:
    build:
      context: ../..
      dockerfile: deploy/podman/platform-mihomo.Containerfile
    image: "localhost/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}:${PAI_IMAGE_TAG:-latest}"
    container_name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}"
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      PAI_UPSTREAM_BASE_URL: "${PAI_MIHOMO_UPSTREAM_BASE_URL:?set the HTTPS Mihomo upstream URL}"
    secrets:
      - platform_database_dsn
      - platform_redis_password
      - source: platform_encryption_keyring
        target: platform_encryption_keyring.json
      - source: account_service_ticket_public_keyring
        target: account_service_ticket_public_keyring.json
      - source: platform_control_cert
        target: platform_control_cert.pem
      - source: platform_control_key
        target: platform_control_key.pem
      - source: account_control_client_ca
        target: account_control_client_ca.pem
      - source: platform_runtime_cert
        target: platform_runtime_cert.pem
      - source: platform_runtime_key
        target: platform_runtime_key.pem
      - source: platform_runtime_ca
        target: platform_runtime_ca.pem
      - mihomo_upstream_bearer_token
    ports:
      - "${PAI_RUNTIME_BIND:-127.0.0.1}:${PAI_RUNTIME_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "/usr/local/bin/platform-mihomo-healthcheck", "-target", "127.0.0.1:9001", "-root-ca", "/run/secrets/platform_runtime_ca.pem", "-server-name", "${PAI_RUNTIME_SERVER_NAME:?set PAI_RUNTIME_SERVER_NAME to the runtime certificate SAN}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks:
      platform-private:
      platform-backplane:
        aliases: [platform-mihomo]

networks:
  platform-private:
    name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-private"
  platform-backplane:
    name: "${PAI_PLATFORM_NETWORK:-paigram-platform-backplane}"
    external: true

volumes:
  platform-postgres-data: {name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-postgres-data"}
  platform-redis-data: {name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-data"}

secrets:
  platform_postgres_password: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-postgres-password"}
  platform_redis_config: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-config"}
  platform_redis_password: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-password"}
  platform_database_dsn: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-database-dsn"}
  platform_encryption_keyring: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-encryption-keyring"}
  account_service_ticket_public_keyring: {external: true, name: "paigram-account-center-service-ticket-public-keyring"}
  platform_control_cert: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-control-cert"}
  platform_control_key: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-control-key"}
  account_control_client_ca: {external: true, name: "paigram-account-center-control-client-ca"}
  platform_runtime_cert: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-cert"}
  platform_runtime_key: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-key"}
  platform_runtime_ca: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-ca"}
  mihomo_upstream_bearer_token: {external: true, name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-upstream-token"}
