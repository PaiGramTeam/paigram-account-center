services:
  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-postgres"
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_mihomo
      POSTGRES_USER: platform_mihomo
      POSTGRES_PASSWORD_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-postgres-password"
    secrets: ["${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-postgres-password"]
    volumes: [platform-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_mihomo -d platform_mihomo"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [platform-private]

  redis:
    image: docker.io/library/redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis"
    restart: unless-stopped
    command: ["redis-server", "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-config", "--appendonly", "yes"]
    secrets:
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-config"
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-password"
    volumes: [platform-redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-password) redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform-private]

  platform-mihomo:
    image: "${PAI_PLATFORM_IMAGE:?set PAI_PLATFORM_IMAGE to an immutable image reference containing @sha256}"
    container_name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}"
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      PAI_UPSTREAM_BASE_URL: "${PAI_MIHOMO_UPSTREAM_BASE_URL:?set the HTTPS Mihomo upstream URL}"
      PAI_DATA_DATABASE_DSN_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-database-dsn"
      PAI_DATA_REDIS_PASSWORD_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-password"
      PAI_SECURITY_CREDENTIAL_ENCRYPTION_KEYRING_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-encryption-keyring"
      PAI_SECURITY_SERVICE_TICKET_PUBLIC_KEYRING_FILE: "/run/secrets/paigram-account-center-service-ticket-public-keyring"
      PAI_SERVER_CONTROL_TLS_CERTIFICATE_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-control-cert"
      PAI_SERVER_CONTROL_TLS_PRIVATE_KEY_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-control-key"
      PAI_SERVER_CONTROL_TLS_CLIENT_CA_FILE: "/run/secrets/paigram-account-center-control-client-ca"
      PAI_SERVER_RUNTIME_TLS_CERTIFICATE_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-cert"
      PAI_SERVER_RUNTIME_TLS_PRIVATE_KEY_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-key"
      PAI_UPSTREAM_BEARER_TOKEN_FILE: "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-upstream-token"
      PAI_METRICS_ADDR: "0.0.0.0:9090"
    secrets:
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-database-dsn"
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-password"
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-encryption-keyring"
      - paigram-account-center-service-ticket-public-keyring
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-control-cert"
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-control-key"
      - paigram-account-center-control-client-ca
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-cert"
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-key"
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-ca"
      - "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-upstream-token"
    ports:
      - "${PAI_RUNTIME_BIND:-127.0.0.1}:${PAI_RUNTIME_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "/usr/local/bin/platform-mihomo-healthcheck", "-target", "127.0.0.1:9001", "-root-ca", "/run/secrets/${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-ca", "-server-name", "${PAI_RUNTIME_SERVER_NAME:?set PAI_RUNTIME_SERVER_NAME to the runtime certificate SAN}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks:
      platform-private:
      platform-backplane:
        aliases: [platform-mihomo]

networks:
  platform-private:
    name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-private"
  platform-backplane:
    name: "${PAI_PLATFORM_NETWORK:-paigram-platform-backplane}"
    external: true

volumes:
  platform-postgres-data: {name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-postgres-data"}
  platform-redis-data: {name: "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-data"}

secrets:
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-postgres-password": {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-config": {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-redis-password": {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-database-dsn": {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-encryption-keyring": {external: true}
  paigram-account-center-service-ticket-public-keyring: {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-control-cert": {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-control-key": {external: true}
  paigram-account-center-control-client-ca: {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-cert": {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-key": {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-runtime-ca": {external: true}
  "${PAI_PLATFORM_INSTANCE:-paigram-platform-mihomo}-upstream-token": {external: true}
