global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/paigram-alerts.yaml

scrape_configs:
  - job_name: account-center
    static_configs:
      - targets: [account-center:8080]

  - job_name: platform-mihomo
    static_configs:
      - targets: [platform-mihomo:9090]
