services:
  prometheus:
    image: docker.io/prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: "${PAI_MONITORING_INSTANCE:-paigram-monitoring}"
    restart: unless-stopped
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "account-center,platform-mihomo,127.0.0.1,localhost"
      no_proxy: "account-center,platform-mihomo,127.0.0.1,localhost"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./paigram-alerts.yaml:/etc/prometheus/paigram-alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PAI_MONITORING_BIND:-127.0.0.1}:${PAI_MONITORING_PORT:-19090}:9090"
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks: [platform-backplane]

networks:
  platform-backplane:
    name: "${PAI_PLATFORM_NETWORK:-paigram-platform-backplane}"
    external: true

volumes:
  prometheus-data:
    name: "${PAI_MONITORING_INSTANCE:-paigram-monitoring}-data"
