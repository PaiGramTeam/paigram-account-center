services:
  account-center:
    environment:
      PAI_PLATFORM_CONTROL_ROOT_CA_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-platform-control-ca"
      PAI_PLATFORM_CONTROL_CERTIFICATE_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-control-client-cert"
      PAI_PLATFORM_CONTROL_PRIVATE_KEY_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-control-client-key"
      PAI_PLATFORM_CONTROL_SERVER_NAME: "${PAI_PLATFORM_CONTROL_SERVER_NAME:-platform-control.internal}"
    secrets:
      - "${PAI_INSTANCE:-paigram-account-center}-platform-control-ca"
      - "${PAI_INSTANCE:-paigram-account-center}-control-client-cert"
      - "${PAI_INSTANCE:-paigram-account-center}-control-client-key"

secrets:
  "${PAI_INSTANCE:-paigram-account-center}-platform-control-ca": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-control-client-cert": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-control-client-key": {external: true}
