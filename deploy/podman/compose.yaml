services:
  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: "${PAI_INSTANCE:-paigram-account-center}-postgres"
    restart: unless-stopped
    environment:
      POSTGRES_DB: paigram
      POSTGRES_USER: paigram
      POSTGRES_PASSWORD_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-postgres-password"
    secrets: ["${PAI_INSTANCE:-paigram-account-center}-postgres-password"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paigram -d paigram"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [account-center]

  redis:
    image: docker.io/library/redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: "${PAI_INSTANCE:-paigram-account-center}-redis"
    restart: unless-stopped
    command: ["redis-server", "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-redis-config", "--appendonly", "yes"]
    secrets:
      - "${PAI_INSTANCE:-paigram-account-center}-redis-config"
      - "${PAI_INSTANCE:-paigram-account-center}-redis-password"
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/${PAI_INSTANCE:-paigram-account-center}-redis-password) redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [account-center]

  migrate:
    image: "${PAI_ACCOUNT_IMAGE:?set PAI_ACCOUNT_IMAGE to an immutable image reference containing @sha256}"
    container_name: "${PAI_INSTANCE:-paigram-account-center}-migrate"
    profiles: [bootstrap]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PAI_DATABASE_DSN_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-database-dsn"
    secrets:
      - "${PAI_INSTANCE:-paigram-account-center}-database-dsn"
    command: ["migrate", "up"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks: [account-center]

  seed:
    image: "${PAI_ACCOUNT_IMAGE:?set PAI_ACCOUNT_IMAGE to an immutable image reference containing @sha256}"
    container_name: "${PAI_INSTANCE:-paigram-account-center}-seed"
    profiles: [bootstrap]
    restart: "no"
    environment:
      PAI_DATABASE_DSN_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-database-dsn"
      ADMIN_EMAIL: "${PAI_ADMIN_EMAIL:-admin@paigram.local}"
      ADMIN_PASSWORD_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-admin-password"
      ADMIN_NAME: "${PAI_ADMIN_NAME:-Administrator}"
    secrets:
      - "${PAI_INSTANCE:-paigram-account-center}-database-dsn"
      - "${PAI_INSTANCE:-paigram-account-center}-admin-password"
    command: ["seed", "all", "--with-admin"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks: [account-center]

  account-center:
    image: "${PAI_ACCOUNT_IMAGE:?set PAI_ACCOUNT_IMAGE to an immutable image reference containing @sha256}"
    container_name: "${PAI_INSTANCE:-paigram-account-center}"
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      PAI_AUTH_REQUIRE_VERIFIED_EMAIL_LOGIN: "${PAI_REQUIRE_EMAIL_VERIFICATION:-false}"
      PAI_FRONTEND_BASE_URL: "${PAI_FRONTEND_BASE_URL:?set PAI_FRONTEND_BASE_URL to the public HTTPS origin}"
      PAI_APP_TRUSTED_PROXIES: "10.77.20.10"
      PAI_DATABASE_DSN_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-database-dsn"
      PAI_REDIS_PASSWORD_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-redis-password"
      PAI_AUTH_SERVICE_TICKET_SIGNING_KEY_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-service-ticket-signing-key"
      PAI_AUTH_OAUTH_SIGNING_KEY_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-oauth-signing-key"
      PAI_SECURITY_ENCRYPTION_KEY_FILE: "/run/secrets/${PAI_INSTANCE:-paigram-account-center}-encryption-key"
    secrets:
      - "${PAI_INSTANCE:-paigram-account-center}-database-dsn"
      - "${PAI_INSTANCE:-paigram-account-center}-redis-password"
      - "${PAI_INSTANCE:-paigram-account-center}-service-ticket-signing-key"
      - "${PAI_INSTANCE:-paigram-account-center}-oauth-signing-key"
      - "${PAI_INSTANCE:-paigram-account-center}-encryption-key"
    ports:
      - "${PAI_ACCOUNT_GRPC_BIND:-127.0.0.1}:${PAI_ACCOUNT_GRPC_PORT:-15051}:50051"
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks: [account-center, platform-backplane]

  frontend:
    image: "${PAI_FRONTEND_IMAGE:?set PAI_FRONTEND_IMAGE to an immutable image reference containing @sha256}"
    container_name: "${PAI_INSTANCE:-paigram-account-center}-frontend"
    restart: unless-stopped
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    depends_on:
      account-center: {condition: service_healthy}
    ports: ["${PAI_HTTP_BIND:-127.0.0.1}:${PAI_HTTP_PORT:-18080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks:
      account-center:
        ipv4_address: 10.77.20.10

networks:
  account-center:
    name: "${PAI_INSTANCE:-paigram-account-center}"
    ipam:
      config:
        - subnet: 10.77.20.0/24
          gateway: 10.77.20.1
  platform-backplane:
    name: "${PAI_PLATFORM_NETWORK:-paigram-platform-backplane}"
    external: true

volumes:
  postgres-data: {name: "${PAI_INSTANCE:-paigram-account-center}-postgres-data"}
  redis-data: {name: "${PAI_INSTANCE:-paigram-account-center}-redis-data"}

secrets:
  "${PAI_INSTANCE:-paigram-account-center}-postgres-password": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-redis-config": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-redis-password": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-database-dsn": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-service-ticket-signing-key": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-oauth-signing-key": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-encryption-key": {external: true}
  "${PAI_INSTANCE:-paigram-account-center}-admin-password": {external: true}
