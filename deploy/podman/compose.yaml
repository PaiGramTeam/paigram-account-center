services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    container_name: "${PAI_INSTANCE:-paigram-account-center}-postgres"
    restart: unless-stopped
    environment:
      POSTGRES_DB: paigram
      POSTGRES_USER: paigram
      POSTGRES_PASSWORD_FILE: /run/secrets/account_postgres_password
    secrets: [account_postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paigram -d paigram"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [account-center]

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: "${PAI_INSTANCE:-paigram-account-center}-redis"
    restart: unless-stopped
    command: ["redis-server", "/run/secrets/account_redis_config", "--appendonly", "yes"]
    secrets: [account_redis_config, account_redis_password]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/account_redis_password) redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [account-center]

  account-center:
    build:
      context: ../..
      dockerfile: deploy/podman/account-center.Containerfile
    image: "localhost/${PAI_INSTANCE:-paigram-account-center}:${PAI_IMAGE_TAG:-latest}"
    container_name: "${PAI_INSTANCE:-paigram-account-center}"
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      PAI_AUTH_REQUIRE_VERIFIED_EMAIL_LOGIN: "${PAI_REQUIRE_EMAIL_VERIFICATION:-false}"
      PAI_FRONTEND_BASE_URL: "${PAI_FRONTEND_BASE_URL:?set PAI_FRONTEND_BASE_URL to the public HTTPS origin}"
      ADMIN_EMAIL: "${PAI_ADMIN_EMAIL:-admin@paigram.local}"
      ADMIN_PASSWORD_FILE: /run/secrets/account_admin_password
      ADMIN_NAME: "${PAI_ADMIN_NAME:-Administrator}"
    secrets:
      - account_database_dsn
      - account_redis_password
      - source: account_service_ticket_signing_key
        target: account_service_ticket_signing_key.json
      - account_oauth_signing_key
      - account_encryption_key
      - account_admin_password
      - source: platform_control_ca
        target: platform_control_ca.pem
      - source: account_control_client_cert
        target: account_control_client_cert.pem
      - source: account_control_client_key
        target: account_control_client_key.pem
      - source: account_grpc_cert
        target: account_grpc_cert.pem
      - source: account_grpc_key
        target: account_grpc_key.pem
    ports:
      - "${PAI_ACCOUNT_GRPC_BIND:-127.0.0.1}:${PAI_ACCOUNT_GRPC_PORT:-15051}:50051"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks: [account-center, platform-backplane]

  frontend:
    build:
      context: ../..
      dockerfile: deploy/podman/frontend.Containerfile
    image: "localhost/${PAI_INSTANCE:-paigram-account-center}-frontend:${PAI_IMAGE_TAG:-latest}"
    container_name: "${PAI_INSTANCE:-paigram-account-center}-frontend"
    restart: unless-stopped
    depends_on:
      account-center: {condition: service_healthy}
    ports: ["${PAI_HTTP_BIND:-127.0.0.1}:${PAI_HTTP_PORT:-18080}:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    networks: [account-center]

networks:
  account-center:
    name: "${PAI_INSTANCE:-paigram-account-center}"
  platform-backplane:
    name: "${PAI_PLATFORM_NETWORK:-paigram-platform-backplane}"
    external: true

volumes:
  postgres-data: {name: "${PAI_INSTANCE:-paigram-account-center}-postgres-data"}
  redis-data: {name: "${PAI_INSTANCE:-paigram-account-center}-redis-data"}

secrets:
  account_postgres_password: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-postgres-password"}
  account_redis_config: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-redis-config"}
  account_redis_password: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-redis-password"}
  account_database_dsn: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-database-dsn"}
  account_service_ticket_signing_key: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-service-ticket-signing-key"}
  account_oauth_signing_key: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-oauth-signing-key"}
  account_encryption_key: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-encryption-key"}
  account_admin_password: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-admin-password"}
  platform_control_ca: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-platform-control-ca"}
  account_control_client_cert: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-control-client-cert"}
  account_control_client_key: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-control-client-key"}
  account_grpc_cert: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-grpc-cert"}
  account_grpc_key: {external: true, name: "${PAI_INSTANCE:-paigram-account-center}-grpc-key"}
