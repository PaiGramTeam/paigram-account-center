name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  contracts:
    name: Contracts and generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/account-center/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: 0.11.28
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Verify contracts and generated artifacts
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task contracts

  account-unit:
    name: Account Center unit and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres@sha256:0fc5c901ec0a3c55ce70b99b040daeb89d5b35b61febbced1b4b24dbc3153ec8 # 16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: paigram_test
          POSTGRES_PASSWORD: paigram_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paigram_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAI_REQUIRE_DATABASE_TESTS: "true"
      PAI_TEST_DATABASE_DSN: postgres://paigram_test:paigram_test_password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: services/account-center/go.sum
      - name: Verify Account Center
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task account-unit

  platform-unit:
    name: Platform service unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: services/platform-mihomo/go.sum
      - name: Verify Platform service
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task platform-unit

  account-integration:
    name: Account Center PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAI_TESTCONTAINERS_PROVIDER: docker
      PAI_INTEGRATION_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres@sha256:0fc5c901ec0a3c55ce70b99b040daeb89d5b35b61febbced1b4b24dbc3153ec8
      PAI_INTEGRATION_REDIS_IMAGE: public.ecr.aws/docker/library/redis@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/account-center/go.sum
            services/platform-mihomo/go.sum
      - name: Run Account Center integration tests
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task account-integration

  platform-integration:
    name: Platform PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAI_TESTCONTAINERS_PROVIDER: docker
      PAI_INTEGRATION_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres@sha256:0fc5c901ec0a3c55ce70b99b040daeb89d5b35b61febbced1b4b24dbc3153ec8
      PAI_INTEGRATION_REDIS_IMAGE: public.ecr.aws/docker/library/redis@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/platform-mihomo/go.sum
      - name: Run Platform integration tests
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task platform-integration

  production-tracer:
    name: Account issuer to production Platform SDK tracer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAI_TESTCONTAINERS_PROVIDER: docker
      PAI_INTEGRATION_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres@sha256:0fc5c901ec0a3c55ce70b99b040daeb89d5b35b61febbced1b4b24dbc3153ec8
      PAI_INTEGRATION_REDIS_IMAGE: public.ecr.aws/docker/library/redis@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/account-center/go.sum
            services/platform-mihomo/go.sum
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: 0.11.28
      - name: Run the production TLS tracer
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task production-tracer

  sdk:
    name: Python SDK quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: 0.11.28
      - name: Verify Python SDK
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task sdk

  sdk-minimum:
    name: Python SDK declared minimum versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: 0.11.28
      - name: Verify SDK minimum dependency versions
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task sdk-minimum

  paigram-compatibility:
    name: PaiGram pinned-commit dependency compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: 0.11.28
      - name: Verify PaiGram compatibility
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task paigram-compatibility

  frontend:
    name: Frontend static, unit, and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify frontend workspace
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task frontend

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAI_CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify repository hygiene
        shell: pwsh
        run: ./scripts/verify-ci.ps1 -Task repository-hygiene

  required-checks:
    name: Required checks
    if: ${{ always() }}
    needs:
      - contracts
      - account-unit
      - platform-unit
      - account-integration
      - platform-integration
      - production-tracer
      - sdk
      - sdk-minimum
      - paigram-compatibility
      - frontend
      - repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        shell: pwsh
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          $results = $env:RESULTS_JSON | ConvertFrom-Json -AsHashtable
          $failed = @($results.GetEnumerator() | Where-Object { $_.Value.result -ne "success" })
          if ($failed.Count -ne 0) {
            $failed | ForEach-Object { Write-Error "$($_.Key): $($_.Value.result)" }
            throw "One or more required verification jobs did not succeed"
          }
