name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

defaults:
  run:
    shell: bash

jobs:
  contracts:
    name: Contracts and generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/account-center/go.sum
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: 0.12.6
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Install Protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Verify contracts and generated artifacts
        run: bash ./scripts/verify-ci.sh contracts

  account-unit:
    name: Account Center unit and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: paigram_test
          POSTGRES_PASSWORD: paigram_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paigram_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAI_REQUIRE_DATABASE_TESTS: "true"
      PAI_TEST_DATABASE_DSN: postgres://paigram_test:paigram_test_password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: services/account-center/go.sum
      - name: Verify Account Center
        run: bash ./scripts/verify-ci.sh account-unit

  platform-unit:
    name: Platform service unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: services/platform-mihomo/go.sum
      - name: Verify Platform service
        run: bash ./scripts/verify-ci.sh platform-unit

  account-integration:
    name: Account Center PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAI_TESTCONTAINERS_PROVIDER: docker
      PAI_INTEGRATION_POSTGRES_IMAGE: postgres:16-alpine
      PAI_INTEGRATION_REDIS_IMAGE: redis:7-alpine
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/account-center/go.sum
            services/platform-mihomo/go.sum
      - name: Run Account Center integration tests
        run: bash ./scripts/verify-ci.sh account-integration

  platform-integration:
    name: Platform PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAI_TESTCONTAINERS_PROVIDER: docker
      PAI_INTEGRATION_POSTGRES_IMAGE: postgres:16-alpine
      PAI_INTEGRATION_REDIS_IMAGE: redis:7-alpine
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/platform-mihomo/go.sum
      - name: Run Platform integration tests
        run: bash ./scripts/verify-ci.sh platform-integration

  production-tracer:
    name: Account issuer to production Platform SDK tracer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAI_TESTCONTAINERS_PROVIDER: docker
      PAI_INTEGRATION_POSTGRES_IMAGE: postgres:16-alpine
      PAI_INTEGRATION_REDIS_IMAGE: redis:7-alpine
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/account-center/go.sum
            services/platform-mihomo/go.sum
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: 0.12.6
      - name: Run the production TLS tracer
        run: bash ./scripts/verify-ci.sh production-tracer

  sdk:
    name: Python SDK quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: 0.12.6
      - name: Verify Python SDK
        run: bash ./scripts/verify-ci.sh sdk

  sdk-minimum:
    name: Python SDK declared minimum versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: 0.12.6
      - name: Verify SDK minimum dependency versions
        run: bash ./scripts/verify-ci.sh sdk-minimum

  frontend:
    name: Frontend static, unit, and production builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: 0.12.6
      - name: Verify frontend workspace
        run: bash ./scripts/verify-ci.sh frontend

  real-browser:
    name: Production browser system acceptance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PAI_TESTCONTAINERS_PROVIDER: docker
      PAI_E2E_CONTAINER_CLI: docker
      PAI_E2E_BROWSER: ${{ matrix.browser }}
      PAI_INTEGRATION_POSTGRES_IMAGE: postgres:16-alpine
      PAI_INTEGRATION_REDIS_IMAGE: redis:7-alpine
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            contracts/gen/go/go.sum
            contracts/runtime/go/go.sum
            services/account-center/go.sum
            services/platform-mihomo/go.sum
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          version: 0.12.6
      - name: Run production browser system acceptance
        run: bash ./scripts/verify-ci.sh real-browser
