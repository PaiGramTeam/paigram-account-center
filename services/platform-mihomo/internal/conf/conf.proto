syntax = "proto3";

package platform.mihomo.conf;

option go_package = "platform-mihomo-service/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Security security = 3;
  Upstream upstream = 4;
}

message Upstream {
  string base_url = 1;
  int32 timeout_seconds = 2;
  string bearer_token_file = 3;
  bool allow_insecure_http = 4;
}

message Server {
  message TLS {
    string certificate_file = 1;
    string private_key_file = 2;
    string client_ca_file = 3;
  }

  message GRPC {
    string network = 1;
    string addr = 2;
    int32 timeout_seconds = 3;
    TLS tls = 4;
  }

  GRPC control = 1;
  GRPC runtime = 2;
}

message Data {
  message Database {
    reserved 1;
    string dsn = 2;
    string dsn_file = 3;
  }

  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    string prefix = 4;
    string password_file = 5;
  }

  Database database = 1;
  Redis redis = 2;
}

message Security {
  string credential_encryption_keyring_file = 1;
  reserved 2;
  string service_ticket_issuer = 3;
  string service_ticket_public_keyring_file = 4;
  reserved 5;
}
