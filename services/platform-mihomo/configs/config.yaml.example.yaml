server:
  control:
    network: tcp
    addr: "0.0.0.0:9000"
    timeout_seconds: 5
  runtime:
    network: tcp
    addr: "0.0.0.0:9001"
    timeout_seconds: 5
data:
  database:
    dsn_file: "/run/secrets/platform_database_dsn"
  redis:
    addr: "127.0.0.1:6379"
    password: ""
    password_file: "/run/secrets/platform_redis_password"
    db: 0
    prefix: "platform-mihomo:"
security:
  credential_encryption_keyring_file: "/run/secrets/platform_encryption_keyring.json"
  service_ticket_issuer: paigram-account-center
  service_ticket_public_keyring_file: "/run/secrets/account_service_ticket_public_keyring.json"
upstream:
  base_url: "https://mihomo-upstream.internal"
  timeout_seconds: 10
  bearer_token_file: "/run/secrets/mihomo_upstream_token"
  root_ca_file: "/run/secrets/mihomo_upstream_ca.pem"
  allow_insecure_http: false
metrics:
  addr: "0.0.0.0:9090"
