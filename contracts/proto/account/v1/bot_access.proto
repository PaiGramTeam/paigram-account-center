syntax = "proto3";

package paigram.v1;

option go_package = "github.com/PaiGramTeam/paigram-account-center/contracts/gen/go/account/v1;accountv1";

import "google/protobuf/timestamp.proto";

service BotAccessService {
  rpc ResolveBotUser(ResolveBotUserRequest) returns (ResolveBotUserResponse);
  rpc ListAccessibleBindings(ListAccessibleBindingsRequest) returns (ListAccessibleBindingsResponse);
  rpc GetPlatformRuntimeRoute(GetPlatformRuntimeRouteRequest) returns (GetPlatformRuntimeRouteResponse);
  rpc IssueServiceTicket(IssueServiceTicketRequest) returns (IssueServiceTicketResponse);
}

enum PlatformAccountStatus {
  PLATFORM_ACCOUNT_STATUS_UNSPECIFIED = 0;
  PLATFORM_ACCOUNT_STATUS_ACTIVE = 1;
  PLATFORM_ACCOUNT_STATUS_INACTIVE = 2;
  PLATFORM_ACCOUNT_STATUS_REVOKED = 3;
}

message PlatformAccountBinding {
  string binding_ref = 1;
  reserved 2;
  reserved "user_id";
  string platform = 3;
  string platform_service_key = 4;
  string account_key = 5;
  string display_name = 6;
  PlatformAccountStatus status = 7;
  uint64 generation = 8;
  reserved "meta_json", "platform_account_id";
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ResolveBotUserRequest {
  string external_user_id = 1;
}

message ResolveBotUserResponse {
  uint64 user_id = 1;
  string bot_id = 2;
  string external_user_id = 3;
  string external_username = 4;
}

message ListAccessibleBindingsRequest {
  string external_user_id = 1;
  string platform = 2;
}

message ListAccessibleBindingsResponse {
  repeated PlatformAccountBinding bindings = 1;
}

message GetPlatformRuntimeRouteRequest {
  string platform_service_key = 1;
}

message GetPlatformRuntimeRouteResponse {
  string platform_key = 1;
  string platform_service_key = 2;
  string runtime_endpoint = 3;
  string runtime_server_name = 4;
  string service_audience = 5;
  repeated string supported_actions = 6;
}

message IssueServiceTicketRequest {
  string external_user_id = 1;
  string binding_ref = 2;
  string requested_action = 3;
  reserved 4;
  reserved "audience";
  string profile_ref = 5;
}

message IssueServiceTicketResponse {
  string ticket = 1;
  string audience = 2;
  google.protobuf.Timestamp expires_at = 3;
  PlatformAccountBinding binding = 4;
}
